name: OpenCodeMobile
options:
  bundleIdPrefix: dev.opencode
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  OpenCodeMobile:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.opencode.mobile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing QR code shown by OpenCode on your computer.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  OpenCodeMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: OpenCodeMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenCodeMobile:
    build:
      targets:
        OpenCodeMobile: all
    test:
      targets: [OpenCodeMobileTests]
